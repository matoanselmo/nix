# BTT S2DW (RP2040 + LIS2DW) on the bed, over USB. The Ubuntu box didn't keep
# its build config, so this is the stock RP2040 USB setup; `make menuconfig`
# fills in the defaults when the firmware builds. BOARD_DIRECTORY and MCU are
# derived by Kconfig, but klipper-flash reads them from this file to pick
# the USB flasher.
CONFIG_MACH_RPXXXX=y
CONFIG_BOARD_DIRECTORY="rp2040"
CONFIG_MACH_RP2040=y
CONFIG_MCU="rp2040"
CONFIG_RP2040_FLASH_W25Q080=y
CONFIG_RP2040_STAGE2_CLKDIV=2
CONFIG_RPXXXX_USB=y
CONFIG_USB=y
